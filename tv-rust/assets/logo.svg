<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="TV-Rust logo">
  <title>TV-Rust</title>
  <desc>Hand-authored vector mark: TV screen with play glyph in the app theme colors (#0E1621 plate, #5EB5F7 accent).</desc>

  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B2946"/>
      <stop offset="0.55" stop-color="#101A29"/>
      <stop offset="1" stop-color="#0A0F18"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8FD3FF"/>
      <stop offset="1" stop-color="#4A9FE8"/>
    </linearGradient>

    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B1320"/>
      <stop offset="1" stop-color="#080D15"/>
    </linearGradient>

    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5EB5F7" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#5EB5F7" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#5EB5F7" stop-opacity="0"/>
    </radialGradient>

    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <!-- plate -->
  <rect x="32" y="32" width="960" height="960" rx="220" fill="url(#plate)"/>
  <rect x="32" y="32" width="960" height="960" rx="220" fill="none"
        stroke="#5EB5F7" stroke-opacity="0.22" stroke-width="4"/>

  <!-- ambient glow behind the screen -->
  <circle cx="512" cy="470" r="330" fill="url(#glow)"/>

  <!-- screen: outer bezel -->
  <rect x="168" y="250" width="688" height="440" rx="64"
        fill="url(#screen)" stroke="url(#accent)" stroke-width="40"/>

  <!-- play glyph, soft bloom beneath -->
  <path d="M470 390 L470 550 L612 470 Z" fill="#5EB5F7" fill-opacity="0.55" filter="url(#softGlow)"/>
  <path d="M470 390 L470 550 L612 470 Z" fill="url(#accent)"/>

  <!-- stand -->
  <rect x="486" y="690" width="52" height="48" fill="url(#accent)" opacity="0.9"/>
  <rect x="386" y="734" width="252" height="40" rx="20" fill="url(#accent)" opacity="0.9"/>
</svg>
