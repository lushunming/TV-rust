name: package

# 三平台产物：每个平台在自己的 runner 上编译 + jlink（jlink 不能交叉生成运行时）
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: TVRust-win-x64
            pkg: dist/TVRust-*-win-x64.zip
          - os: macos-14          # Apple Silicon
            artifact: TVRust-macos-arm64
            pkg: dist/TVRust-*-macos-arm64.dmg
          - os: ubuntu-22.04      # 较老 glibc，兼容性更好
            artifact: TVRust-linux-x64
            pkg: dist/TVRust-*-linux-x86_64.tar.gz

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"       # jlink 必须来自目标平台 JDK

      - uses: dtolnay/rust-toolchain@stable

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"   # wrapper 发行版下载不稳，直接用 actions 安装

      - name: Build spider-host jar
        run: gradle --console=plain :spider-host:fatJar

      - name: Linux GUI deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libgl1-mesa-dev libwayland-dev \
            libx11-xcb-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./packaging/package-windows.ps1 -SkipHostJar -SkipCargoBuild -RecreateRuntime -Jdk "$env:JAVA_HOME"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          chmod +x packaging/package-macos.sh
          ./packaging/package-macos.sh

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          chmod +x packaging/package-linux.sh
          ./packaging/package-linux.sh

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.pkg }}
          if-no-files-found: error
