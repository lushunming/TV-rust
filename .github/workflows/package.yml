name: package

# 两平台产物：每个平台在自己的 runner 上编译 + jlink（jlink 不能交叉生成运行时）。
# macOS 暂不发布：没有 Developer ID 证书就无法签名/公证，出包会被 Gatekeeper 拦下，
# 体感上等于发了个装不上的包；等签名链路具备后再加回来（packaging/package-macos.sh 保留备用）。
# 触发方式：
#   - 推 tag（v*）        → 两个平台构建完成后自动发布 GitHub Release
#   - workflow_dispatch  → 只构建并上传 artifacts，不发布（用于验证打包链路）
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

# 发布 Release 需要写权限；新仓库的 GITHUB_TOKEN 默认是只读的
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: TVRust-win-x64
            pkg: dist/TVRust-*-win-x64.zip
          - os: ubuntu-22.04      # 较老 glibc，兼容性更好
            artifact: TVRust-linux-x64
            pkg: dist/TVRust-*-linux-x86_64.tar.gz

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"       # jlink 必须来自目标平台 JDK；宿主运行时用 25 LTS

      - uses: dtolnay/rust-toolchain@stable

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.1.0"  # 与 spider-host/gradle/wrapper 保持一致

      # spider-host 已独立成工程（自己的 settings.gradle.kts + wrapper），
      # 仓库根没有 Gradle 构建，因此必须在 spider-host 目录里构建。
      - name: Build spider-host jar
        working-directory: spider-host
        run: gradle --console=plain fatJar

      # 打包脚本默认从 tv-rust/Cargo.toml 取版本号；打 tag 时以 tag 为准，
      # 避免 Release 标题是 v1.2.8、资产却叫 TVRust-0.1.0 这种错位。
      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            v="${GITHUB_REF_NAME#v}"
          else
            v="$(sed -n 's/^version *= *"\(.*\)"/\1/p' tv-rust/Cargo.toml | head -n1)"
          fi
          echo "version=${v:-0.0.0}" >> "$GITHUB_OUTPUT"

      - name: Linux GUI deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libgl1-mesa-dev libwayland-dev \
            libx11-xcb-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./packaging/package-windows.ps1 -SkipHostJar -RecreateRuntime -Jdk "$env:JAVA_HOME" -Version "${{ steps.ver.outputs.version }}"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          chmod +x packaging/package-linux.sh
          ./packaging/package-linux.sh

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.pkg }}
          if-no-files-found: error

  # 只有 tag 推送才发布；手动触发仅产出 artifacts
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List release assets
        run: ls -lh dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          draft: false
          prerelease: false
