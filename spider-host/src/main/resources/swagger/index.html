<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>spider-host API · Swagger UI</title>
    <link rel="stylesheet" href="/swagger-ui/swagger-ui.css">
    <style>
        html, body { margin: 0; padding: 0; background: #fafafa; }
        .host-bar {
            display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
            padding: 10px 20px; background: #1b1b1b; color: #e8e8e8;
            font: 13px/1.5 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
        }
        .host-bar strong { color: #fff; font-size: 14px; }
        .host-bar a { color: #8ab4f8; text-decoration: none; }
        .host-bar a:hover { text-decoration: underline; }
        .host-bar .hint { color: #9aa0a6; margin-left: auto; }
        .host-bar code { background: #2d2d2d; padding: 2px 6px; border-radius: 4px; color: #f1f3f4; }
    </style>
</head>
<body>
<div class="host-bar">
    <strong>spider-host HTTP API</strong>
    <a href="/openapi.json" target="_blank" rel="noopener">openapi.json</a>
    <a href="/api/health" target="_blank" rel="noopener">健康检查</a>
    <a href="/api/sites" target="_blank" rel="noopener">站点列表</a>
    <span class="hint">先调用 <code>POST /api/config/load</code> 加载配置，再测试内容接口</span>
</div>
<div id="swagger-ui"></div>

<script src="/swagger-ui/swagger-ui-bundle.js"></script>
<script src="/swagger-ui/swagger-ui-standalone-preset.js"></script>
<script>
    window.onload = function () {
        window.ui = SwaggerUIBundle({
            url: "/openapi.json",
            dom_id: "#swagger-ui",
            deepLinking: true,
            displayRequestDuration: true,
            docExpansion: "list",
            defaultModelsExpandDepth: 1,
            tryItOutEnabled: true,
            persistAuthorization: true,
            validatorUrl: null,
            presets: [
                SwaggerUIBundle.presets.apis,
                SwaggerUIStandalonePreset
            ],
            plugins: [
                SwaggerUIBundle.plugins.DownloadUrl
            ],
            layout: "StandaloneLayout"
        });
    };
</script>
</body>
</html>
